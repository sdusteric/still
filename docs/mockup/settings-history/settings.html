<!doctype html><meta charset=utf-8><title>Snap settings mockup</title><link rel=stylesheet href=base.css>
<style>
.win{width:480px;background:var(--desk)}
.top{background:var(--bar);padding:12px 14px 6px;border-bottom:1px solid var(--sep)}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:2px}
.tab{width:76px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text2)}
.tab b{display:block;width:18px;height:18px;border:1.6px solid currentColor;border-radius:5px}
.tab.on{background:var(--wash);color:var(--brandText)}
.form{padding:20px;display:flex;flex-direction:column;gap:16px}
h3{font-size:14px;line-height:18px;display:flex;align-items:center;gap:7px;padding:6px 0 8px 4px}
h3:before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
.grp{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep) inset}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:40px}
.row+.row{border-top:1px solid var(--sep)}
.row small{display:block;font-size:11px;line-height:15px;color:var(--text2)}
.sw{width:30px;height:18px;border-radius:9px;background:var(--brand);position:relative}.sw:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#fff}.sw.off{background:var(--fill)}.sw.off:after{right:auto;left:2px}
.pop{background:var(--btn);box-shadow:0 0 0 .5px var(--btnEdge);border-radius:6px;padding:2px 10px;font-size:12px}
</style>
<body><div class=stage style="gap:0;padding:0">
<script>
function make(cls){return `<div class="${cls}" style="padding:28px;background:var(--stage);color:var(--text)"><div class="win">
<div class=top><div style="display:flex;justify-content:space-between;align-items:center"><div class=tl><i style=background:#FF5F57></i><i style=background:#FEBC2E></i><i style=background:#28C840></i></div><div style="font-weight:600">General</div><div style=width:52px></div></div>
<div class=tabs><div class="tab on"><b></b>General</div><div class=tab><b></b>Capture</div><div class=tab><b></b>Quick Access</div><div class=tab><b></b>Recording</div><div class=tab><b></b>Shortcuts</div></div></div>
<div class=form>
<div><h3 class=display>Startup</h3><div class=grp><div class=row><span>Launch at login</span><span class=sw></span></div></div></div>
<div><h3 class=display>Saving</h3><div class=grp>
<div class=row><span>Save folder<small>Saved</small></span><span class=pop>Choose...</span></div>
<div class=row><span>File name<small class=num>Snap 2026-10-24 at 14.05.03.png</small></span><span class=pop>Pattern</span></div>
<div class=row><span>Format</span><span class=pop>PNG</span></div></div></div>
<div><h3 class=display>Updates</h3><div class=grp>
<div class=row><span>Check for updates automatically</span><span class=sw></span></div>
<div class=row><span>Snap 1.4.2<small>Last checked today at 13:58</small></span><span class=pop>Check Now</span></div></div></div>
</div></div></div>`}
document.body.innerHTML=make('')+make('dark');
</script>
